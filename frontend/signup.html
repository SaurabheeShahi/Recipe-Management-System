<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Signup - Recipe Manager</title>

    <link
        rel="stylesheet"
        href="css/signup.css"
    >
</head>


<body>

<div class="signup-page">

    <div class="signup-card">

        <div class="brand">

            <div class="logo-icon">
                🍴
            </div>

            <h1>
                Recipe Manager
            </h1>

            <p>
                Create Admin Account
            </p>

        </div>


        <form id="signupForm">


            <!-- Full Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                >

                <small id="passwordMessage">
                    Password must be at least 8 characters.
                </small>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- Terms -->

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the system terms and conditions.

                </label>

            </div>


            <!-- Message -->

            <div
                id="signupMessage"
                aria-live="polite"
            ></div>


            <!-- Submit -->

            <button
                type="submit"
                class="signup-btn"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div class="login-link">

            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>


    </div>

</div>


<script src="js/signup.js"></script>

</body>

</html>
